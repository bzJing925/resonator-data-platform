name: Build Desktop Installers

permissions:
  contents: write

on:
  push:
    branches: [feat/deploy]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync
        env:
          # macos-latest（Xcode 26）编译 zipfile-deflate64 的老旧内置 zlib 两处兼容：
          # -std=gnu89 兼容 K&R C；-Dfdopen=fdopen 使 zutil.h 跳过 fdopen→NULL 宏
          # （该宏会破坏 SDK _stdio.h 的 fdopen 声明）
          CFLAGS: -std=gnu89 -Dfdopen=fdopen

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build desktop installer
        run: python build.py --target ${{ matrix.target }}
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aln-desktop-${{ matrix.target }}
          path: frontend/release/*

      - name: Publish installers to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: ALN Desktop 1.0.3
          files: frontend/release/*
          fail_on_unmatched_files: true

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlN 代理模型</title>
<style>
:root {
  --bg: #181B21; --bg-2: #1F232B; --bg-3: #262B34;
  --border: #333a45;
  --fg-1: #E8EAED; --fg-2: #C4C8D0; --fg-3: #8A919D;
  --warn: #d97706;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg-2);
  font: 12px/1.5 Inter, system-ui, -apple-system, sans-serif;
}
#app { display: flex; flex-direction: column; height: 100%; padding: 10px 14px; gap: 10px; }
#meta-desc { margin: 0; font-size: 11px; color: var(--fg-3); word-break: break-all; }
.toolbar { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
.lbl { font-size: 11px; color: var(--fg-3); margin-bottom: 2px; }
.row { display: flex; gap: 6px; align-items: center; }
input[type="number"], select {
  width: 76px; font-size: 12px; padding: 2px 6px;
  background: var(--bg-3); border: 1px solid var(--border);
  color: var(--fg-1); border-radius: 3px;
}
select { width: auto; }
input[type="range"] { width: 150px; accent-color: #60a5fa; }
.toggles { display: flex; gap: 14px; font-size: 12px; color: var(--fg-2); padding-bottom: 3px; }
.toggles label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
.warn { font-size: 12px; color: var(--warn); }
.hidden { display: none !important; }
#chart { flex: 1; min-height: 380px; }
#table-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 12px; }
th, td { padding: 3px 10px; }
thead th { text-align: left; color: var(--fg-3); font-weight: normal; }
thead th.num { text-align: right; }
td.rowname { color: var(--fg-2); }
td.num {
  text-align: right; color: var(--fg-1);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
#loading {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column; gap: 10px;
  align-items: center; justify-content: center;
  background: var(--bg); color: var(--fg-2); font-size: 14px;
}
#loading .sub { font-size: 11px; color: var(--fg-3); }
#loading.error { color: #f87171; white-space: pre-wrap; padding: 0 40px; }
.spin {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid var(--fg-3); border-top-color: transparent;
  border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <p id="meta-desc" role="status"></p>

  <div class="toolbar">
    <div>
      <div class="lbl">EG（<span id="eg-val">1.00</span>）</div>
      <div class="row">
        <input type="range" id="eg-slider" step="0.05" value="1.0">
        <input type="number" id="eg-num" step="0.05" value="1.0">
      </div>
    </div>
    <div>
      <div class="lbl">FL（<span id="fl-val">0.50</span>）</div>
      <div class="row">
        <input type="range" id="fl-slider" step="0.05" value="0.5">
        <input type="number" id="fl-num" step="0.05" value="0.5">
      </div>
    </div>
    <div>
      <div class="lbl">AG (μm)</div>
      <input type="number" id="ag-num" step="0.1" value="1.0">
    </div>
    <div>
      <div class="lbl">面积 (μm²)</div>
      <select id="area-sel"></select>
    </div>
    <div>
      <div class="lbl">PF (massloading)</div>
      <select id="pf-sel">
        <option value="0">无</option>
        <option value="1">有</option>
      </select>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="show-base" checked> B0 基准</label>
      <label><input type="checkbox" id="show-pts" checked> 稀疏点</label>
      <label id="truth-wrap"><input type="checkbox" id="show-true" checked> 格均值真值</label>
    </div>
    <span id="spinner" class="spin hidden" title="计算中"></span>
  </div>

  <div id="warn-grid" class="warn hidden">⚠ 该结构组合不在训练网格内（或未流片），结果为外推/插值</div>
  <div id="warn-sim" class="warn hidden">⚠ 面积 <span id="sim-area"></span> μm² 为仿真外推档：标签来自校准后的 COMSOL 仿真（无实测验证），精度仅作参考；面积外其余变量的可靠性不变</div>

  <div id="chart"></div>

  <div id="table-wrap" class="hidden">
    <table>
      <thead>
        <tr>
          <th>指标</th>
          <th class="num">fs (GHz)</th>
          <th class="num">fp (GHz)</th>
          <th class="num">kt² (%)</th>
          <th class="num">Qs</th>
          <th class="num">Qp</th>
          <th class="num">Qs bodeQ</th>
          <th class="num">Qp bodeQ</th>
        </tr>
      </thead>
      <tbody>
        <tr id="param-row">
          <td class="rowname">预测</td>
          <td class="num">—</td><td class="num">—</td><td class="num">—</td><td class="num">—</td>
          <td class="num">—</td><td class="num">—</td><td class="num">—</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div id="loading">
  <div class="spin"></div>
  <div>代理模型加载中…</div>
  <div class="sub">模型与运行时已内嵌（约 20 MB），首次打开需数秒</div>
</div>

<script>%%PLOTLY_JS%%</script>
<script>%%ORT_JS%%</script>
<script>%%DATA_JS%%</script>
<script>%%APP_JS%%</script>
</body>
</html>
